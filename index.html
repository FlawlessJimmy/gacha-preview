<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f11">
<meta name="robots" content="noindex, nofollow">
<title>가챠 머신 설치 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=4">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="view" aria-label="복도에 가챠 머신을 세워 본 3D 화면"></canvas>

<header class="top glass">
  <h1>가챠 머신 설치 미리보기.</h1>
  <p>복도 사진 한 장으로 만든 가상 배치입니다.</p>
</header>

<div class="hint glass" id="hint">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V6.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.2c0 3.2-2.3 5.3-5.3 5.3-2.2 0-3.6-.9-4.8-2.8L5 14.4c-.6-1 .7-2.1 1.6-1.3L8 14.5V11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>드래그해서 둘러보고, 바닥을 눌러 그 자리로 걸어가 보세요.</span>
</div>

<nav class="views glass" aria-label="보는 자리">
  <button data-view="entry" class="on"><i class="ic ic-entry"></i><span>입구에서</span></button>
  <button data-view="near"><i class="ic ic-near"></i><span>다가가서</span></button>
  <button data-view="front"><i class="ic ic-front"></i><span>정면에서</span></button>
</nav>

<button class="clean-btn glass" id="clean" title="화면만 보기 (H)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <span>화면만 보기</span>
</button>
<button class="ui-on" id="uiOn">메뉴 다시 보기 <kbd>H</kbd></button>

<button class="fab glass" id="fab" aria-expanded="true" aria-controls="panel">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4.5v5M6 14.5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <span>배치 조절</span>
</button>

<section class="panel glass" id="panel" aria-label="배치 조절">
  <div class="seg" role="group" aria-label="설치 전후">
    <button data-on="0">설치 전</button>
    <button data-on="1" class="on">설치 후</button>
    <i class="seg-thumb"></i>
  </div>

  <div class="status" id="status" data-level="ok">
    <i class="dot"></i><span id="statusText">소화전과 겹치지 않습니다.</span>
  </div>

  <div class="row">
    <span class="lab">디자인 <b id="vVar">레드</b></span>
    <div class="swatches" role="group" aria-label="머신 디자인 고르기">
      <button data-variant="red" data-name="레드" class="on" aria-pressed="true" aria-label="레드 (LINK THE SPACE)"><i style="--c:#e5252c"></i><span>레드</span></button>
      <button data-variant="daybe" data-name="옐로" aria-pressed="false" aria-label="옐로 (DAYBE)"><i style="--c:#f3cf14"></i><span>옐로</span></button>
      <button data-variant="mlb" data-name="블루" aria-pressed="false" aria-label="블루 (MLB)"><i style="--c:#8fb2f7"></i><span>블루</span></button>
      <button data-variant="mttire" data-name="네온" aria-pressed="false" aria-label="네온 (MTTIRÉ)"><i style="--c:#f4f4f2;--ring:#1fa9ff"></i><span>네온</span></button>
      <button data-variant="hyatt" data-name="화이트" aria-pressed="false" aria-label="화이트 (GRAND HYATT)"><i style="--c:#eef0f8;--ring:#9fd8ff"></i><span>화이트</span></button>
    </div>
  </div>

  <label class="row">
    <span class="lab">위치 <b id="vPos">소화전에서 약 3.7m</b></span>
    <input type="range" id="rPos" min="0" max="1000" value="600" aria-label="벽을 따라 위치 옮기기">
    <span class="ends"><em>소화전 쪽</em><em>엘리베이터 쪽</em></span>
  </label>

  <label class="row">
    <span class="lab">방향 <b id="vRot">벽과 나란히</b></span>
    <input type="range" id="rRot" min="0" max="90" value="0" step="1" aria-label="머신 방향 돌리기">
    <span class="ends"><em>벽과 나란히</em><em>입구를 향해</em></span>
  </label>

  <div class="spec"><span>머신 규격</span><b>W 650 × D 500 × H 1750mm</b></div>

  <p class="note">복도 치수는 사진에서 추정한 값입니다. 카메라 높이 1.5m를 가정했으며 실측과 다를 수 있습니다.</p>
</section>

<div class="loader" id="loader"><i></i><span>복도를 세우는 중입니다.</span></div>

<script type="module" src="main.js?v=8"></script>
</body>
</html>
